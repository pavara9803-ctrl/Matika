<script src="./assets/js/vendor/tailwind.min.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        saffron: { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f',950:'#451a03' },
        maroon: { 700:'#701a1d',800:'#581113',900:'#3f0a0c',950:'#260507' }
      },
      fontFamily: { sans: ['Inter','Noto Serif Sinhala','Segoe UI','sans-serif'] }
    }
  }

<script src="assets/js/matika-theme.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { font-family: 'Noto Serif Sinhala', 'Inter', serif; -webkit-tap-highlight-color: transparent; }
.sr-box { position:sticky; top:68px; z-index:20; margin-top:14px; padding:10px 0 8px; background:linear-gradient(var(--m-paper,#fffdf8) 80%,transparent); }
:root.dark .sr-box { background:linear-gradient(#0f172a 80%,transparent); }
.sr-field { display:flex; align-items:center; gap:10px; padding:0 14px; border:2px solid var(--ca-ring); border-radius:14px; background:var(--ca-panel); }
.sr-field:focus-within { border-color:#d97706; box-shadow:0 0 0 3px rgba(217,119,6,.2); }
.sr-field i { color:var(--m-ink-soft); }
.sr-input { flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:17px; padding:13px 0; color:inherit; }
.sr-input::-webkit-search-cancel-button, .sr-input::-webkit-search-decoration { -webkit-appearance:none; display:none; }
.sr-clear { border:0; background:transparent; color:var(--m-ink-soft); font-size:18px; padding:6px; cursor:pointer; }
.sr-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.sr-count { margin:12px 2px 0; font-size:13px; color:var(--m-ink-soft); }
.sr-item { display:block; margin-top:10px; padding:13px 16px; border:1px solid var(--m-rule); border-radius:14px; background:var(--ca-panel); text-decoration:none; color:inherit; }
.sr-item:hover, .sr-item:focus-visible { border-color:#d97706; box-shadow:0 2px 10px -4px rgba(0,0,0,.25); outline:none; }
.sr-ctx { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:12.5px; color:var(--m-ink-soft); margin:0 0 4px; }
.sr-tag { font-weight:700; padding:1px 9px; border-radius:999px; background:var(--m-leaf); color:var(--m-lacquer); }
:root.dark .sr-tag { color:#fcd34d; }
.sr-name { margin:0; font-size:17px; font-weight:700; line-height:1.6; color:var(--m-lacquer); }
:root.dark .sr-name { color:#fcd34d; }
.sr-sub { margin:0; font-size:13.5px; color:var(--m-ink-soft); line-height:1.7; }
.sr-snip { margin:6px 0 0; font-size:14.5px; line-height:1.85; }
.sr-snip b { font-size:12px; margin-right:6px; padding:1px 8px; border-radius:6px; background:rgba(217,119,6,.14); }
.sr-snip mark, .sr-name mark { background:#fde68a; color:#3f0a0c; border-radius:3px; padding:0 1px; }
.sr-more { display:block; width:100%; margin-top:14px; padding:11px; border:1.5px solid var(--ca-ring); border-radius:12px; background:transparent; font:inherit; font-weight:700; cursor:pointer; color:inherit; }
.sr-empty { margin-top:24px; padding:18px; text-align:center; border:1px dashed var(--m-rule); border-radius:14px; line-height:1.9; }
</style>
<link rel="stylesheet" href="assets/css/matika-ui.css">
<link rel="stylesheet" href="assets/css/paramattha.css">
</head>
<body class="h-full flex flex-col text-slate-800 dark:text-slate-100 bg-amber-50/30 dark:bg-slate-900 antialiased">

<!-- ============ HEADER ============ -->
<header class="sticky top-0 z-30 bg-maroon-900 text-amber-100 shadow-md border-b-2 border-saffron-500">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="p-2 rounded-lg bg-maroon-800 hover:bg-maroon-700 text-saffron-200" title="ආපසු">
      <i class="fa-solid fa-arrow-left text-lg"></i>
    </a>
    <div class="flex items-center mx-auto">
      <div class="w-9 h-9 rounded-full bg-saffron-500/20 border border-saffron-400 flex items-center justify-center text-saffron-300 shrink-0">
        <i class="fa-solid fa-magnifying-glass text-xl"></i>
      </div>
      <h1 class="font-bold text-xl sm:text-2xl ml-2 text-saffron-100" id="sr-head">සෙවුම</h1>
    </div>
    <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-maroon-800 hover:bg-maroon-700 text-saffron-200" title="තේමාව">
      <i id="theme-toggle-icon" class="fa-solid fa-moon text-lg"></i>
    </button>
  </div>
</header>

<main class="flex-1 ca-main w-full mx-auto p-4 sm:p-6 pb-16" style="max-width:52rem">
  <section class="ca-hero">
    <p class="ca-hero__kicker" id="sr-kicker" data-no-i18n></p>
    <h1 id="sr-title" data-no-i18n></h1>
    <p class="ca-hero__lead" id="sr-lead" data-no-i18n></p>
  </section>
  <div class="sr-box" role="search">
    <label class="sr-field">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input id="sr-q" class="sr-input" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" data-no-i18n>
      <button type="button" id="sr-x" class="sr-clear hidden" aria-label="✕">✕</button>
    </label>
    <div class="sr-chips" id="sr-chips" role="group" data-no-i18n></div>
  </div>
  <p class="sr-count" id="sr-count" aria-live="polite" data-no-i18n></p>
  <div id="sr-list" data-no-i18n></div>
</main>

<script>
function toggleDarkMode() {
  var html = document.documentElement;
  var icon = document.getElementById('theme-toggle-icon');
  if (html.classList.contains('dark')) {
    html.classList.remove('dark');
    localStorage.setItem('abhidhamma_theme', 'light');
    if (icon) icon.className = 'fa-solid fa-moon text-lg';
  } else {
    html.classList.add('dark');
    localStorage.setItem('abhidhamma_theme', 'dark');
    if (icon) icon.className = 'fa-solid fa-sun text-lg';
  }
}
try {
  if (localStorage.getItem('abhidhamma_theme') === 'dark' ||
      (!localStorage.getItem('abhidhamma_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
    var ti = document.getElementById('theme-toggle-icon'); if (ti) ti.className = 'fa-solid fa-sun text-lg';
  }
} catch (e) {}
</script>
<script src="assets/js/i18n.js" defer></script>
<script src="assets/js/matika-ui.js" defer></script>
<script src="assets/js/sw-update.js" defer></script>
<script src="assets/js/updates-notice.js" defer></script>
<script src="assets/js/pages/search-page.js" defer></script>
</body>
</html>
