# =====================================================================
#  අභිධම්ම මාතිකා (Abhidhamma Matika) — offline Linux app (Tauri / WebKitGTK)
#  අවශ්‍ය විට පමණක්:  GitHub → Actions → "Build Linux app" → Run workflow
#  • version හිස්ව තැබුවොත් app-version.json හි අවසාන අගයට 1ක් එක් කරයි
#  ප්‍රතිඵලය: GitHub Releases (linux-vX.Y.Z):
#    • Abhidhamma-Matika.AppImage — ඕනෑම distro එකක; chmod +x කර ධාවනය කරන්න
#    • Abhidhamma-Matika.deb      — Debian / Ubuntu / Mint
# =====================================================================
name: Build Linux app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version — හිස්ව තබන්න (ස්වයංක්‍රීයව අවසාන අගය + 1)'
        required: false
        default: ''
      notes:
        description: 'අලුත් දේ (release සටහනේ පෙන්වයි). හිස්ව තැබිය හැක'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri

      - name: System libraries (WebKitGTK ආදිය)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev libxdo-dev libssl-dev file desktop-file-utils

      - name: Version
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$IN_VERSION" ]; then
            echo "APP_VERSION=$IN_VERSION" >> "$GITHUB_ENV"; echo "APP_VERSION=$IN_VERSION"
          else
            node .github/scripts/app-version.mjs next linux app-version.json
          fi

      - name: Install Tauri CLI
        working-directory: desktop-app
        run: npm install --no-audit --no-fund

      - name: Copy site files into the app + set version
        working-directory: desktop-app
        run: |
          npm run prepare-www
          npm run set-version

      - name: Build .AppImage and .deb
        working-directory: desktop-app
        run: npx tauri build --bundles deb,appimage

      - name: Collect files
        run: |
          mkdir -p rel
          cp desktop-app/src-tauri/target/release/bundle/appimage/*.AppImage rel/Abhidhamma-Matika.AppImage
          cp desktop-app/src-tauri/target/release/bundle/deb/*.deb rel/Abhidhamma-Matika.deb
          chmod +x rel/Abhidhamma-Matika.AppImage
          ls -la rel

      - uses: actions/upload-artifact@v4
        with:
          name: Abhidhamma-Matika-Linux-v${{ env.APP_VERSION }}
          path: rel/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Linux ${{ env.APP_VERSION }}
          body: |
            අභිධම්ම මාතිකා — Linux ${{ env.APP_VERSION }} (offline)
            • Abhidhamma-Matika.AppImage — ඕනෑම distro එකක: `chmod +x Abhidhamma-Matika.AppImage && ./Abhidhamma-Matika.AppImage`
            • Abhidhamma-Matika.deb — Debian / Ubuntu / Mint: `sudo apt install ./Abhidhamma-Matika.deb`

            ${{ inputs.notes }}
          files: |
            rel/Abhidhamma-Matika.AppImage
            rel/Abhidhamma-Matika.deb

      - name: Record version in app-version.json
        env:
          VERSION: ${{ env.APP_VERSION }}
          NOTES: ${{ inputs.notes }}
          URL: https://github.com/${{ github.repository }}/releases/download/linux-v${{ env.APP_VERSION }}/Abhidhamma-Matika.AppImage
          URL2: https://github.com/${{ github.repository }}/releases/download/linux-v${{ env.APP_VERSION }}/Abhidhamma-Matika.deb
          LABEL2: .deb (Debian / Ubuntu)
          PAGE: https://github.com/${{ github.repository }}/releases/tag/linux-v${{ env.APP_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export SIZE=$(stat -c%s rel/Abhidhamma-Matika.AppImage)
          export SIZE2=$(stat -c%s rel/Abhidhamma-Matika.deb)
          SITE="$RUNNER_TEMP/site"
          for i in 1 2 3; do
            rm -rf "$SITE"
            git clone -q --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$SITE"
            node .github/scripts/app-version.mjs save linux "$SITE/app-version.json"
            cd "$SITE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app-version.json
            git commit -q -m "app-version.json: Linux ${VERSION}" || { echo "no change"; break; }
            if git push -q origin HEAD:main; then echo "app-version.json updated"; break; fi
            cd - >/dev/null; sleep 5
          done
