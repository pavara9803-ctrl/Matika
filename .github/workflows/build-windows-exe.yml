# =====================================================================
#  අභිධම්ම මාතිකා (Abhidhamma Matika) — offline Windows app (Tauri / WebView2)
#  අවශ්‍ය විට පමණක්:  GitHub → Actions → "Build Windows EXE" → Run workflow
#  • version හිස්ව තැබුවොත් app-version.json හි අවසාන අගයට 1ක් එක් කරයි (උදා: 1.0.1 → 1.0.2)
#  ප්‍රතිඵලය: එම run එකේ "Artifacts" සහ GitHub Releases (windows-vX.Y.Z):
#    • Abhidhamma-Matika-Setup.exe — install කිරීමේදී "මට පමණක්" හෝ "සියලු පරිශීලකයින්ට" තෝරාගත හැක
#  release එකෙන් පසු app-version.json යාවත්කාලීන වේ.
#  සටහන: පෙර Electron ක්‍රමය (desktop/ ෆෝල්ඩරය) repo එකේ ඉතිරිව ඇත; ගැටලුවක් ආවොත්
#  මෙම commit එක revert කර එයට ආපසු යා හැක.
# =====================================================================
name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version — හිස්ව තබන්න (ස්වයංක්‍රීයව අවසාන අගය + 1)'
        required: false
        default: ''
      notes:
        description: 'අලුත් දේ (release සටහනේ පෙන්වයි; නව පේළියකට \n). හිස්ව තැබිය හැක'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri

      # අනුවාදය: අතින් දුන්නේ නැත්නම් app-version.json හි අවසාන අගය + 1
      - name: Version
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$IN_VERSION" ]; then
            echo "APP_VERSION=$IN_VERSION" >> "$GITHUB_ENV"; echo "APP_VERSION=$IN_VERSION"
          else
            node .github/scripts/app-version.mjs next windows app-version.json
          fi

      - name: Install Tauri CLI
        working-directory: desktop-app
        run: npm install --no-audit --no-fund

      - name: Copy site files into the app + set version
        working-directory: desktop-app
        run: |
          npm run prepare-www
          npm run set-version

      - name: Build installer (.exe)
        working-directory: desktop-app
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Abhidhamma-Matika-Windows-v${{ env.APP_VERSION }}
          path: desktop-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # GitHub Releases: installer එක සෑම අනුවාදයකටම එකම නමින් (සෘජු බාගත කිරීම)
      - name: Prepare release file
        run: |
          mkdir -p rel
          cp desktop-app/src-tauri/target/release/bundle/nsis/*.exe rel/Abhidhamma-Matika-Setup.exe
          ls -la rel

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Windows ${{ env.APP_VERSION }}
          body: |
            අභිධම්ම මාතිකා — Windows ${{ env.APP_VERSION }} (offline)
            • Abhidhamma-Matika-Setup.exe — install කිරීමේදී "මට පමණක්" (Administrator අවශ්‍ය නැත) හෝ "සියලු පරිශීලකයින්ට" තෝරන්න.
            "Windows protected your PC" පෙන්වුවහොත්: More info → Run anyway.

            ${{ inputs.notes }}
          files: rel/Abhidhamma-Matika-Setup.exe
          make_latest: true

      - name: Record version in app-version.json
        env:
          VERSION: ${{ env.APP_VERSION }}
          NOTES: ${{ inputs.notes }}
          URL: https://github.com/${{ github.repository }}/releases/download/windows-v${{ env.APP_VERSION }}/Abhidhamma-Matika-Setup.exe
          PAGE: https://github.com/${{ github.repository }}/releases/tag/windows-v${{ env.APP_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export SIZE=$(stat -c%s rel/Abhidhamma-Matika-Setup.exe)
          SITE="$RUNNER_TEMP/site"
          for i in 1 2 3; do
            rm -rf "$SITE"
            git clone -q --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$SITE"
            node .github/scripts/app-version.mjs save windows "$SITE/app-version.json"
            cd "$SITE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app-version.json
            git commit -q -m "app-version.json: Windows ${VERSION}" || { echo "no change"; break; }
            if git push -q origin HEAD:main; then echo "app-version.json updated"; break; fi
            cd - >/dev/null; sleep 5
          done
