name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy site files into the desktop app
        shell: bash
        run: |
          mkdir -p desktop/app desktop/build
          for f in *.html manifest.json; do cp "$f" desktop/app/; done
          cp -r assets data matika paramattha desktop/app/
          # ඇප් එකට අවශ්‍ය නොවන විශාල ගොනු ඉවත් කරන්න (exe ප්‍රමාණය අඩු කිරීමට)
          rm -rf desktop/app/assets/screenshots
          find desktop/app/assets/icons -type f ! -name 'launchericon-512x512.png' ! -name '192.png' ! -name '512.png' ! -name '16.png' ! -name '128.png' -size +100k -delete
          cp assets/icons/launchericon-512x512.png desktop/build/icon.png

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build installer and portable exe
        working-directory: desktop
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Tika-Matika-Windows
          path: |
            desktop/dist/*.exe

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
