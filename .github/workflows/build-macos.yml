# =====================================================================
#  අභිධම්ම මාතිකා (Abhidhamma Matika) — offline macOS app (Tauri / WKWebView)
#  අවශ්‍ය විට පමණක්:  GitHub → Actions → "Build macOS app" → Run workflow
#  • version හිස්ව තැබුවොත් app-version.json හි අවසාන අගයට 1ක් එක් කරයි
#  ප්‍රතිඵලය: GitHub Releases (macos-vX.Y.Z):
#    • Abhidhamma-Matika.dmg — Intel සහ Apple Silicon දෙකටම (universal)
#  සටහන: Apple developer අත්සනක් නැති නිසා පළමු වර විවෘත කිරීමේදී
#  "unidentified developer" පණිවිඩය එයි — ඇප් එක මත Control+click → Open.
# =====================================================================
name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version — හිස්ව තබන්න (ස්වයංක්‍රීයව අවසාන අගය + 1)'
        required: false
        default: ''
      notes:
        description: 'අලුත් දේ (release සටහනේ පෙන්වයි). හිස්ව තැබිය හැක'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri

      - name: Version
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$IN_VERSION" ]; then
            echo "APP_VERSION=$IN_VERSION" >> "$GITHUB_ENV"; echo "APP_VERSION=$IN_VERSION"
          else
            node .github/scripts/app-version.mjs next macos app-version.json
          fi

      - name: Install Tauri CLI
        working-directory: desktop-app
        run: npm install --no-audit --no-fund

      - name: Copy site files into the app + set version
        working-directory: desktop-app
        run: |
          npm run prepare-www
          npm run set-version

      - name: Build universal .dmg
        working-directory: desktop-app
        run: npx tauri build --target universal-apple-darwin --bundles dmg

      - name: Collect file
        run: |
          mkdir -p rel
          cp desktop-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg rel/Abhidhamma-Matika.dmg
          ls -la rel

      - uses: actions/upload-artifact@v4
        with:
          name: Abhidhamma-Matika-macOS-v${{ env.APP_VERSION }}
          path: rel/Abhidhamma-Matika.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: macOS ${{ env.APP_VERSION }}
          body: |
            අභිධම්ම මාතිකා — macOS ${{ env.APP_VERSION }} (offline)
            • Abhidhamma-Matika.dmg — Intel සහ Apple Silicon දෙකටම.
            පළමු වර විවෘත කිරීමේදී "unidentified developer" පණිවිඩය පැමිණියහොත්:
            Applications ෆෝල්ඩරයේ ඇප් එක මත Control+click → Open → Open.

            ${{ inputs.notes }}
          files: rel/Abhidhamma-Matika.dmg

      - name: Record version in app-version.json
        env:
          VERSION: ${{ env.APP_VERSION }}
          NOTES: ${{ inputs.notes }}
          URL: https://github.com/${{ github.repository }}/releases/download/macos-v${{ env.APP_VERSION }}/Abhidhamma-Matika.dmg
          PAGE: https://github.com/${{ github.repository }}/releases/tag/macos-v${{ env.APP_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export SIZE=$(stat -f%z rel/Abhidhamma-Matika.dmg)
          SITE="$RUNNER_TEMP/site"
          for i in 1 2 3; do
            rm -rf "$SITE"
            git clone -q --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$SITE"
            node .github/scripts/app-version.mjs save macos "$SITE/app-version.json"
            cd "$SITE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app-version.json
            git commit -q -m "app-version.json: macOS ${VERSION}" || { echo "no change"; break; }
            if git push -q origin HEAD:main; then echo "app-version.json updated"; break; fi
            cd - >/dev/null; sleep 5
          done
