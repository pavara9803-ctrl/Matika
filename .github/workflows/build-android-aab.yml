name: Build Android AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.1.0)'
        required: false
        default: '1.1.0'
      publish_release:
        description: 'Publish the signed AAB as a GitHub Release (easy download link)'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare keystore
        id: ks
        working-directory: android
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d "[:space:]" | base64 -d > android.keystore
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - using a throw-away test key. This AAB can NOT be uploaded to Google Play."
            keytool -genkeypair -keystore android.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass testpass123 -keypass testpass123 -dname "CN=test"
            echo "KEY_ALIAS=test" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=testpass123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=testpass123" >> "$GITHUB_ENV"
            echo "mode=test" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect keystore (aliases and entry types only)
        working-directory: android
        run: |
          keytool -list -keystore android.keystore -storepass "$KEYSTORE_PASSWORD" 2>&1 | grep -vi "password" | sed 's/^/  /' || true

      - name: Fill in version and key alias
        working-directory: android
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          VERSION_CODE=$(date -u +%y%m%d%H)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${VERSION_NAME:-1.1.0}" >> "$GITHUB_ENV"
          node -e '
            const fs=require("fs");
            const m=JSON.parse(fs.readFileSync("twa-manifest.json","utf8"));
            m.signingKey.alias=process.env.KEY_ALIAS;
            m.appVersionName=process.env.VERSION_NAME||"1.1.0";
            m.appVersion=m.appVersionName;
            m.appVersionCode=parseInt(process.argv[1],10);
            fs.writeFileSync("twa-manifest.json",JSON.stringify(m,null,2));
            console.log("versionCode",m.appVersionCode);
          ' "$VERSION_CODE"

      - name: Install Android SDK components and Bubblewrap
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK at: $SDK"
          ls "$SDK" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
          ls "$SDK/build-tools" "$SDK/platforms"
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<JSON
          {"jdkPath":"$JAVA_HOME","androidSdkPath":"$SDK"}
          JSON
          npm install -g @bubblewrap/cli@1.22.4

      - name: Generate Android project
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Build and sign AAB (Gradle + jarsigner)
        working-directory: android
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab app-release-bundle.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            app-release-bundle.aab "$KEY_ALIAS"
          jarsigner -verify app-release-bundle.aab | head -3
          ls -la *.aab

      - name: Show signing certificate fingerprint
        working-directory: android
        run: |
          keytool -list -v -keystore android.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA256|Alias" || true

      - name: Rename AAB with version
        working-directory: android
        run: cp app-release-bundle.aab "matika-${APP_VERSION_NAME}-${VERSION_CODE}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: matika-aab-${{ steps.ks.outputs.mode }}
          path: android/matika-*.aab

      - name: Publish AAB as a GitHub Release
        if: ${{ inputs.publish_release && steps.ks.outputs.mode == 'release' }}
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="aab-v${APP_VERSION_NAME}-${VERSION_CODE}"
          FILE="matika-${APP_VERSION_NAME}-${VERSION_CODE}.aab"
          NOTES="Google Play Console වෙත upload කිරීම සඳහා signed Android App Bundle.

          - versionName: ${APP_VERSION_NAME}
          - versionCode: ${VERSION_CODE}
          - commit: ${GITHUB_SHA}"
          gh release create "$TAG" "$FILE" \
            --title "Matika AAB ${APP_VERSION_NAME} (${VERSION_CODE})" \
            --notes "$NOTES" \
          || gh release upload "$TAG" "$FILE" --clobber
          gh release view "$TAG" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
