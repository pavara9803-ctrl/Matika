name: Build Android AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.1.0)'
        required: false
        default: '1.1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare keystore
        id: ks
        working-directory: android
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - using a throw-away test key. This AAB can NOT be uploaded to Google Play."
            keytool -genkeypair -keystore android.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass testpass123 -keypass testpass123 -dname "CN=test"
            echo "KEY_ALIAS=test" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=testpass123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=testpass123" >> "$GITHUB_ENV"
            echo "mode=test" >> "$GITHUB_OUTPUT"
          fi

      - name: Fill in version and key alias
        working-directory: android
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          VERSION_CODE=$(date -u +%y%m%d%H)
          node -e '
            const fs=require("fs");
            const m=JSON.parse(fs.readFileSync("twa-manifest.json","utf8"));
            m.signingKey.alias=process.env.KEY_ALIAS;
            m.appVersionName=process.env.VERSION_NAME||"1.1.0";
            m.appVersion=m.appVersionName;
            m.appVersionCode=parseInt(process.argv[1],10);
            fs.writeFileSync("twa-manifest.json",JSON.stringify(m,null,2));
            console.log("versionCode",m.appVersionCode);
          ' "$VERSION_CODE"

      - name: Install Android SDK components and Bubblewrap
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK at: $SDK"
          ls "$SDK" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
          ls "$SDK/build-tools" "$SDK/platforms"
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<JSON
          {"jdkPath":"$JAVA_HOME","androidSdkPath":"$SDK"}
          JSON
          npm install -g @bubblewrap/cli@1.22.4

      - name: Generate Android project and build AAB
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
          ls -la *.aab

      - name: Show signing certificate fingerprint
        working-directory: android
        run: |
          keytool -list -v -keystore android.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA256|Alias" || true

      - uses: actions/upload-artifact@v4
        with:
          name: matika-aab-${{ steps.ks.outputs.mode }}
          path: android/app-release-bundle.aab
