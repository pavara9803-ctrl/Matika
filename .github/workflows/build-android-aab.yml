# =====================================================================
#  Tika Matika App — Android App Bundle (.aab) build  [Bubblewrap / TWA]
#  ස්වයංක්‍රීයව ධාවනය නොවේ — අවශ්‍ය විට පමණක්:
#    GitHub → Actions → "Build Android AAB" → Run workflow → Run workflow
#  • version code / name හිස්ව තැබුවොත් app-version.json හි අවසාන අගයට 1ක් එක් කරයි
#    (උදා: 23 / 3.0.2 → 24 / 3.0.3). අවශ්‍ය නම් අතින් ද දිය හැක.
#    වැදගත්: Play Console එකට upload කරන සෑම .aab එකකම versionCode පෙර එකට වඩා
#    විශාල විය යුතුය; Android Studio වලින් build කළේ නම් ද එම අංකය මෙහි සටහන් කරන්න.
#  • ප්‍රතිඵලය: එම run එකේ "Artifacts" සහ GitHub Releases
#    (tag: android-v<name>-code<code>) → .aab එක Play Console →
#    Production → Create new release වෙත upload කරන්න.
#  • Repo Settings → Secrets and variables → Actions හි පහත 4 අවශ්‍යයි; නැත්නම්
#    පරීක්ෂණ සඳහා throw-away key එකකින් build වේ (Play එකට upload කළ නොහැක):
#      KEYSTORE_BASE64   KEY_ALIAS   KEYSTORE_PASSWORD   KEY_PASSWORD
# =====================================================================
name: Build Android AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code — හිස්ව තබන්න (app-version.json හි අවසාන අගය + 1)'
        required: false
        default: ''
      version_name:
        description: 'Version name — හිස්ව තබන්න (ස්වයංක්‍රීයව, උදා: 3.0.3)'
        required: false
        default: ''
      publish_release:
        description: 'signed AAB එක GitHub Release එකකට ද (පහසු download link)'
        required: false
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release සහ app-version.json
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare keystore
        id: ks
        working-directory: android
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d "[:space:]" | base64 -d > android.keystore
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - using a throw-away test key. This AAB can NOT be uploaded to Google Play."
            keytool -genkeypair -keystore android.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass testpass123 -keypass testpass123 -dname "CN=test"
            echo "KEY_ALIAS=test" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=testpass123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=testpass123" >> "$GITHUB_ENV"
            echo "mode=test" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect keystore (aliases and entry types only)
        working-directory: android
        run: |
          keytool -list -keystore android.keystore -storepass "$KEYSTORE_PASSWORD" 2>&1 | grep -vi "password" | sed 's/^/  /' || true

      # අනුවාදය: අතින් දුන්නේ නැත්නම් app-version.json හි අවසාන අගය + 1
      - name: Version
        env:
          IN_CODE: ${{ inputs.version_code }}
          IN_NAME: ${{ inputs.version_name }}
        run: |
          node .github/scripts/app-version.mjs next android app-version.json
          [ -n "$IN_CODE" ] && echo "VERSION_CODE=$IN_CODE" >> "$GITHUB_ENV"
          [ -n "$IN_NAME" ] && echo "VERSION_NAME=$IN_NAME" >> "$GITHUB_ENV"
          true

      - name: Fill in version and key alias
        working-directory: android
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -lt 1 ]; then
            echo "Version code must be a whole number, e.g. 24 (got: '$VERSION_CODE')"; exit 1
          fi
          node -e '
            const fs=require("fs");
            const m=JSON.parse(fs.readFileSync("twa-manifest.json","utf8"));
            m.signingKey.alias=process.env.KEY_ALIAS;
            m.appVersionName=process.env.VERSION_NAME;
            m.appVersion=m.appVersionName;
            m.appVersionCode=parseInt(process.env.VERSION_CODE,10);
            fs.writeFileSync("twa-manifest.json",JSON.stringify(m,null,2));
            console.log("version",m.appVersionName,"code",m.appVersionCode);
          '

      - name: Install Android SDK components and Bubblewrap
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK at: $SDK"
          ls "$SDK" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
          ls "$SDK/build-tools" "$SDK/platforms"
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<JSON
          {"jdkPath":"$JAVA_HOME","androidSdkPath":"$SDK"}
          JSON
          npm install -g @bubblewrap/cli@1.22.4

      - name: Generate Android project
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Build and sign AAB (Gradle + jarsigner)
        working-directory: android
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "matika-${VERSION_NAME}-code${VERSION_CODE}.aab"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            "matika-${VERSION_NAME}-code${VERSION_CODE}.aab" "$KEY_ALIAS"
          jarsigner -verify "matika-${VERSION_NAME}-code${VERSION_CODE}.aab" | head -3
          ls -la *.aab

      - name: Show signing certificate fingerprint
        working-directory: android
        run: |
          keytool -list -v -keystore android.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA256|Alias" || true

      - uses: actions/upload-artifact@v4
        with:
          name: matika-aab-${{ steps.ks.outputs.mode }}-v${{ env.VERSION_NAME }}-code${{ env.VERSION_CODE }}
          path: android/matika-*.aab
          if-no-files-found: error

      # signed build එකක් නම්: .aab එක GitHub Release එකකට ද (සෘජු බාගත කිරීම)
      - name: Publish AAB as a GitHub Release
        if: ${{ inputs.publish_release && steps.ks.outputs.mode == 'release' }}
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${VERSION_NAME}-code${VERSION_CODE}"
          FILE="matika-${VERSION_NAME}-code${VERSION_CODE}.aab"
          NOTES="Google Play Console වෙත upload කිරීම සඳහා signed Android App Bundle.

          - versionName: ${VERSION_NAME}
          - versionCode: ${VERSION_CODE}
          - commit: ${GITHUB_SHA}"
          gh release create "$TAG" "$FILE" \
            --title "Matika AAB ${VERSION_NAME} (code ${VERSION_CODE})" \
            --notes "$NOTES" \
          || gh release upload "$TAG" "$FILE" --clobber
          gh release view "$TAG" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'

      # signed build එකක් සාර්ථක වූ පසු: අනුවාදය app-version.json හි සටහන් වේ (ඊළඟ build එක +1)
      - name: Record version in app-version.json
        if: ${{ steps.ks.outputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SITE="$RUNNER_TEMP/site"
          for i in 1 2 3; do
            rm -rf "$SITE"
            git clone -q --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$SITE"
            VERSION="$VERSION_NAME" node .github/scripts/app-version.mjs save android "$SITE/app-version.json"
            cd "$SITE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app-version.json
            git commit -q -m "app-version.json: Android ${VERSION_NAME} (version code ${VERSION_CODE})" || { echo "no change"; break; }
            if git push -q origin HEAD:main; then echo "app-version.json updated"; break; fi
            cd - >/dev/null; sleep 5
          done
